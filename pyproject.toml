[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-power-forecast"
version = "0.1.0"
description = "煤气发电短周期滚动预测与防泄漏验证"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "joblib>=1.3,<2",
  "lightgbm>=4.3,<5",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
experiments = [
  "catboost>=1.2,<2",
  "optuna>=4,<5",
  "ruptures>=1.1,<2",
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
